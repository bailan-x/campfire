<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>篝火 · DST 服务器管理</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand">🔥 <span>篝火</span><small>DST 服务器管理</small></div>
  <nav class="tabs">
    <a href="#overview" data-tab="overview">概览</a>
    <a href="#worlds" data-tab="worlds">世界</a>
    <a href="#mods" data-tab="mods">模组</a>
    <a href="#worldgen" data-tab="worldgen">世界生成</a>
    <a href="#logs" data-tab="logs">日志</a>
  </nav>
  <div class="right">
    <select id="clusterSwitch" title="切换当前世界"></select>
    <span id="agentState" class="pill">连接中…</span>
  </div>
</header>

<main>
  <section id="page-overview" class="page"></section>
  <section id="page-worlds" class="page"></section>
  <section id="page-mods" class="page"></section>
  <section id="page-worldgen" class="page"></section>
  <section id="page-logs" class="page"></section>
</main>

<div id="drawer" class="drawer hidden">
  <div class="drawer-bg" data-close></div>
  <aside class="drawer-panel" id="drawerBody"></aside>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-panel">
    <h3 id="modalTitle">任务</h3>
    <pre id="modalLog"></pre>
    <button class="btn" data-close-modal>关闭</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
